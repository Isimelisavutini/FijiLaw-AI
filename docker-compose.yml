services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: fijilaw
      POSTGRES_USER: fijilaw
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - fijilaw_postgres:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/02-membership-security.sql:/docker-entrypoint-initdb.d/02-membership-security.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fijilaw -d fijilaw"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  fijilaw_postgres:
