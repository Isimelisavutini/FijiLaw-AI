services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: fijilaw
      POSTGRES_USER: fijilaw
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - fijilaw_postgres:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
volumes:
  fijilaw_postgres:
