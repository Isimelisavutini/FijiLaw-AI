name: FijiLaw
options:
  bundleIdPrefix: fj.com.fijilaw
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
targets:
  FijiLaw:
    type: application
    platform: iOS
    sources:
      - path: FijiLaw
    info:
      path: FijiLaw/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fj.com.fijilaw.app
        PRODUCT_NAME: FijiLaw
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
