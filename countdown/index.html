<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countdown Landing Page</title>
  <style>
    :root{--bg:#f6f5f3;--blue:#4774f2;--gold:#9a5a16;--text:#151515;}
    *{box-sizing:border-box;margin:0;padding:0} body{min-height:100vh;font-family:Inter,Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;overflow-x:hidden}
    .landing{width:min(1180px,100%);min-height:100vh;padding:48px 56px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto;gap:20px 40px;align-items:center;position:relative}
    .top-label{grid-column:1/-1;display:flex;align-items:center;gap:22px;font-size:clamp(1.1rem,2vw,1.9rem);font-weight:800;animation:fadeDown .8s ease-out both}
    .arrow-left,.arrow-right{width:190px;height:9px;background:var(--gold);position:relative;border-radius:4px}
    .arrow-left{animation:arrowLeftMove 1.8s ease-in-out infinite}.arrow-right{animation:arrowRightMove 1.8s ease-in-out infinite}
    .arrow-left:before{content:"";position:absolute;left:-2px;top:50%;transform:translateY(-50%);border-top:17px solid transparent;border-bottom:17px solid transparent;border-right:25px solid var(--gold)}
    .arrow-right:after{content:"";position:absolute;right:-2px;top:50%;transform:translateY(-50%);border-top:17px solid transparent;border-bottom:17px solid transparent;border-left:25px solid var(--gold)}
    .content{align-self:center;padding-left:6px;animation:fadeUp .9s .15s ease-out both}.days{font-size:clamp(6rem,15vw,12rem);line-height:.82;letter-spacing:-8px;font-weight:900;color:var(--blue);margin-bottom:26px;animation:numberPulse 2.8s ease-in-out infinite;transform-origin:left center}.days-label{color:var(--gold);font-size:clamp(1.4rem,3vw,2.8rem);font-weight:900;letter-spacing:1px;margin-bottom:16px}.code{font-size:clamp(.85rem,1.4vw,1.2rem);font-weight:800;font-style:italic;letter-spacing:1px;margin-bottom:22px}.dots{display:flex;gap:18px}.dots span{width:15px;height:15px;border:2px solid #ad7b45;border-radius:50%;display:block;animation:dotPulse 1.4s ease-in-out infinite}.dots span:nth-child(2){animation-delay:.18s}.dots span:nth-child(3){animation-delay:.36s}
    .hourglass-wrap{display:flex;justify-content:center;align-items:center;min-height:460px;animation:fadeIn 1s .25s ease-out both}.hourglass{width:290px;height:430px;position:relative;animation:hourglassFloat 4s ease-in-out infinite;transform-origin:50% 50%;filter:drop-shadow(0 14px 18px rgba(0,0,0,.08))}.cap{position:absolute;left:15px;width:260px;height:34px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#c67b28,#9a5918);z-index:3}.cap.top{top:0}.cap.bottom{bottom:0;transform:rotate(180deg)}.glass{position:absolute;top:28px;left:48px;width:194px;height:375px;background:linear-gradient(90deg,rgba(255,255,255,.9),rgba(219,236,244,.35),rgba(255,255,255,.8));clip-path:polygon(0 0,100% 0,74% 43%,52% 50%,73% 57%,100% 100%,0 100%,28% 57%,48% 50%,27% 43%);border-left:5px solid rgba(145,105,55,.6);border-right:5px solid rgba(145,105,55,.4);overflow:hidden}.sand-top,.sand-bottom{position:absolute;left:22px;right:22px;background:#e7cf9b;opacity:.85}.sand-top{top:55px;height:96px;clip-path:polygon(0 15%,100% 0,78% 100%,22% 100%);animation:sandTopShift 3.8s ease-in-out infinite alternate}.sand-bottom{bottom:36px;height:110px;clip-path:polygon(0 100%,100% 100%,74% 18%,53% 0,26% 18%);animation:sandBottomShift 3.8s ease-in-out infinite alternate}.stream{position:absolute;top:172px;left:94px;width:7px;height:85px;background:#e7cf9b;border-radius:8px;animation:sandFlow 1.15s ease-in-out infinite;transform-origin:top center}
    .bottom-link{grid-column:1/-1;display:flex;justify-content:center;align-items:center;gap:18px;padding-top:8px;font-size:clamp(1.15rem,2.3vw,2rem);font-weight:800;animation:fadeUp .9s .45s ease-out both}.cta{color:var(--text);text-decoration:none;transition:.2s ease;position:relative}.cta:hover{color:var(--gold)}.cta:after{content:"";position:absolute;left:0;bottom:-5px;width:0;height:3px;background:var(--gold);border-radius:4px;transition:width .28s ease}.cta:hover:after{width:100%}
    @keyframes fadeDown{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}@keyframes fadeIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}@keyframes numberPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}@keyframes hourglassFloat{0%,100%{transform:rotate(14deg) translateY(0)}50%{transform:rotate(11deg) translateY(-10px)}}@keyframes sandFlow{0%,100%{opacity:.45;transform:scaleY(.72)}50%{opacity:1;transform:scaleY(1.08)}}@keyframes sandTopShift{from{transform:translateY(0) scaleY(1)}to{transform:translateY(7px) scaleY(.95)}}@keyframes sandBottomShift{from{transform:translateY(4px) scaleY(.95)}to{transform:translateY(0) scaleY(1.03)}}@keyframes dotPulse{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.35);opacity:1}}@keyframes arrowLeftMove{0%,100%{transform:translateX(0)}50%{transform:translateX(-12px)}}@keyframes arrowRightMove{0%,100%{transform:translateX(0)}50%{transform:translateX(12px)}}
    @media(max-width:760px){.landing{padding:28px 24px 36px;grid-template-columns:1fr;grid-template-rows:auto auto auto auto;gap:18px}.top-label{justify-content:center;flex-wrap:wrap}.content{text-align:center}.days{letter-spacing:-4px}.dots{justify-content:center}.hourglass-wrap{min-height:340px}.hourglass{animation:hourglassFloatMobile 4s ease-in-out infinite}.bottom-link{flex-wrap:wrap;text-align:center}.arrow-left,.arrow-right{width:120px}@keyframes hourglassFloatMobile{0%,100%{transform:scale(.78) rotate(14deg) translateY(0)}50%{transform:scale(.78) rotate(11deg) translateY(-8px)}}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="landing">
    <div class="top-label"><span>Today’s date</span><div class="arrow-left"></div></div>
    <section class="content"><div class="days" id="days">187</div><div class="days-label">DAYS TO GO</div><div class="code">AGFIJI100</div><div class="dots"><span></span><span></span><span></span></div></section>
    <section class="hourglass-wrap"><div class="hourglass"><div class="cap top"></div><div class="glass"><div class="sand-top"></div><div class="stream"></div><div class="sand-bottom"></div></div><div class="cap bottom"></div></div></section>
    <div class="bottom-link"><div class="arrow-right"></div><a class="cta" href="#celebration">Celebration dates</a></div>
  </main>
  <script>const celebrationDate=new Date("2027-02-25T00:00:00");function updateCountdown(){const now=new Date();const diff=celebrationDate-now;const days=Math.max(0,Math.ceil(diff/(1000*60*60*24)));document.getElementById("days").textContent=days}updateCountdown();setInterval(updateCountdown,3600000);</script>
</body>
</html>
